# Hexagon-rings example (see README.md), ring 2 of 3: the cores are drawn between 5 and 7 km from the centre.
# Only the [EventGenerator] section: the rings use the showers of the Dummy library. The three .ini files differ
# only in out_db, hex_size, hex_inner and EventSeed (each ring its own, so that they do not draw the same cores).
[EventGenerator]
# Input SQLite database with Xmax distances (from XmaxGetter)
showers_db = ../ExampleFluxWithDummyXmax.sqlite
# CSV file containing antenna positions (requires ID, CS_X_North_m, CS_Y_West_m, CS_Z_Height_m)
antennas_csv = ../../4-DC3EventGenerator/GRAND_GP65_RTK_positions_Corrected.csv
# Output SQLite database for triggered events
out_db = ./Ring2.sqlite
# Hexagon center coordinates (Northing, Westing, Up in meters) in the array CS
center_n = 0.0
center_w = 0.0
center_u = 0.0
# Hexagon radius / vertex distance in meters
hex_size = 7000.0
# Inner hexagon in meters: above 0, the cores are drawn only in the ring between it and hex_size (see the README of stage 4)
hex_inner = 5000.0
# Cherenkov selection cone half-angle in degrees
cone_angle = 1.0
# Minimum antennas required to trigger an event
min_trigger = 3
# Core positions tested for every shower: the fraction that triggers is the shower's trigger probability
cores_per_event = 500
# Number of times to reuse each input shower (its weight is shared among the reuses)
reuse = 1
# Distance to Xmax bracket filter in km
dist_min = 0.0
dist_max = 1000.0
# Dry run flag (True to display diagnostic plots without saving to DB)
dry_run = False
# used for the generation of random numbers (Integer), dont define the variable and it will be random
EventSeed = 43
