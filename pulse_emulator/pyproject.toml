[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pulse_emulator"
version = "0.1.0"
description = "Neural emulator of radio pulses generated by air showers, and tools to reconstruct shower parameters from it."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Arsène Ferrière", email = "arsene.ferriere@proton.me" }]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.0",
  "matplotlib>=3.8",
  "torch>=2.1",
  "scikit-learn>=1.3",
  "joblib>=1.3",
  "emcee>=3.1",
  "iminuit>=2.25",
  "uproot>=5.2",
  "psutil>=5.9",
  "tqdm>=4.66",
  "seaborn>=0.13",
]

[project.optional-dependencies]
train = ["optuna>=3.5"]
# Plane-wave-front initial guesses (recons_utils.pwf_guess)
pwf   = ["PWF_reconstruction @ git+https://github.com/arsenefer/PWF_reconstruction.git"]
dev   = ["pytest", "ruff"]
all   = ["pulse_emulator[train,pwf]"]

[project.urls]
Repository = "https://github.com/arsenefer/pulse_emulator"

[tool.setuptools.packages.find]
where = ["src"]
