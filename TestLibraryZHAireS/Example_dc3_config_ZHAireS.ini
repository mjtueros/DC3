# DC3 Central Configuration File
# This file contains configuration sections for all DC3 simulation modules.
# Note that all paths should be relative to the location of the ini file! regardles of where you run the sript (absolute paths work too)

[FluxGenerator]
# Total number of simulation showers to generate
Nsims = 250
# Output SQLite database file
OutputFileName = ../ExampleFlux.sqlite
# Prefix for unique shower names
LibraryPrefix = Xi
# Interaction models (comma-separated, e.g., Sib, QGSJet)
ModelBins = Sib
# Primary particle types to alternate between (comma-separated, e.g., Proton, Iron)
PrimaryBins = Proton, Iron
# Zenith angle range in degrees (distributed uniformly in log10(1/cos(theta)))
mintheta = 50.0
maxtheta = 88.0
# Azimuth angle range in degrees (distributed uniformly)
minphi = 0.0
maxphi = 360.0
# Energy limits in GeV (distributed uniformly in log10(Energy))
# 10^7.5 ~= 3.16227766e7 GeV (0.03162 EeV), 10^9.6 ~= 3.98107171e9 GeV (3.98107 EeV)
Emin = 3.16227766e7
Emax = 3.9810717055e9
# Natural flux used for the NaturalWeight of each shower (see 1-DC3FluxGenerator/NaturalWeights.py):
# spectrum TALE2018 or Auger2021; geometry flat (rate per km^2 of ground) or sphere
natural_spectrum = TALE2018
natural_geometry = flat
# Whether to display interactive Matplotlib distribution plots before generating
show_plots = True

[ShowerInputGenerator]
# Input SQLite database from FluxGenerator
db_file = ./ExampleFlux.sqlite
# Static AIRES skeleton file
skeleton_file = ../2-DC3ShowerInputGenerator/Example.ZHAireS.Skeleton.inp
# Directory to store the generated AIRES .inp files
out_dir = ./AiresInputs

[CoREASShowerInputGenerator]
# Input SQLite database from FluxGenerator
db_file = ./ExampleFlux.sqlite
# Static CORSIKA skeleton file (needs a CORSIKA build with the CURVED, SLANT, THIN and SIBYLL options)
skeleton_file = ../2-DC3ShowerInputGenerator/Example.CoREAS.Skeleton.inp
# Static CoREAS parameter file, used for the SIM<run>.reas of each shower (CORSIKA builds with CoREAS need it)
reas_skeleton_file = ../2-DC3ShowerInputGenerator/Example.CoREAS.Skeleton.reas
# Thinning level: fraction of the primary energy below which thinning starts (as "Thinning 1E-5 Rel" in the ZHAireS skeleton)
thinning_level = 1e-5
# Statistical weight factor, as AIRES's ThinningWFactor: the weight limit of all particles is 14 per GeV x thinning energy x this factor (AIRES manual, Eq. 2.23)
thinning_weight_factor = 0.06
# Directory to store the generated inputs, one sub-directory per shower (existing ones are not overwritten).
# The inputs give CORSIKA the absolute path of each shower sub-directory, so generate them where CORSIKA will run.
out_dir = ./CoREASInputs

[XmaxGetter]
# Input SQLite database from FluxGenerator
InputFile = ./ExampleFlux.sqlite
# Output SQLite database with computed Xmax columns
OutputFile = ./ExampleFluxWithZHAireSXmax.sqlite
# Whether to display diagnostic plots
show_plots = False
# Set the Library type, so the code knows what routine to call to get Xmax. Set to Dummy to get Dummy Values
LibraryType = ZHAireS
# Directory where the shower library resides (with one shower per sub-directory, each sub-directory name should be the same
LibraryDir = ./ShowerLibrary/
# Detector altitude in km for atmospheric depth integration (used only in dummy mode)
detector_alt_km = 1.4

[EventGenerator]
# Input SQLite database with Xmax distances (from XmaxGetter)
showers_db = ./ExampleFluxWithZHAireSXmax.sqlite
# CSV file containing antenna positions (requires ID, CS_X_North_m, CS_Y_West_m, CS_Z_Height_m)
antennas_csv = ../4-DC3EventGenerator/GRAND_GP65_RTK_positions_Corrected.csv
# Output SQLite database for triggered events
out_db = ./ExampleZHAireSTriggeredEvents.sqlite
# Hexagon center coordinates (Northing, Westing, Up in meters) in the array CS
center_n = 0.0
center_w = 0.0
center_u = 0.0
# Hexagon radius / vertex distance in meters
hex_size = 7000.0
# Cherenkov selection cone half-angle in degrees
cone_angle = 1.0
# Minimum antennas required to trigger an event
min_trigger = 3
# Core positions tested for every shower: the fraction that triggers is the shower's trigger probability
cores_per_event = 500
# Number of times to reuse each input shower (its weight is shared among the reuses)
reuse = 1
# Distance to Xmax bracket filter in km
dist_min = 0.0
dist_max = 1000.0
# Dry run flag (True to display diagnostic plots without saving to DB)
dry_run = False

[EventEfieldInputGenerator]
# Input SQLite database with triggered events (from EventGenerator)
db_file = ./ExampleZHAireSTriggeredEvents.sqlite
# Base ZHAireS skeleton .inp file
skeleton_file = ../2-DC3ShowerInputGenerator/Example.ZHAireS.Skeleton.inp
# Directory to store generated ZHAireS .inp files
out_dir = ./ZHAireS-Inputs
# Optional path to directory with original .sry files for metadata cross-validation (leave empty to skip)
sry_dir =
